name: Build Windows app
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: List the repository files
        shell: pwsh
        run: Get-ChildItem -Name

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install VST hosting libraries
        run: python -m pip install numpy pedalboard sounddevice

      - name: Check the libraries load
        run: python -c "import numpy, pedalboard, sounddevice; print('libraries ok', pedalboard.__version__)"

      - name: Check the program files compile
        run: python -m compileall -q arranger_app.py sty_play.py sty_parse.py multipad.py effects.py vst_out.py

      - name: Build the app
        run: python -m PyInstaller --noconfirm --onedir --name DX-Arranger --hidden-import vst_out --collect-all pedalboard --collect-all sounddevice arranger_app.py

      - name: Add the panel, helper files and readme
        shell: pwsh
        run: |
          Copy-Item dxarrangernew1.html, bridge.js, Start-DX-Arranger.bat, Start-for-phone.bat, README-WINDOWS.txt dist/DX-Arranger/
          Compress-Archive -Path dist/DX-Arranger -DestinationPath DX-Arranger-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DX-Arranger-Windows
          path: DX-Arranger-Windows.zip
